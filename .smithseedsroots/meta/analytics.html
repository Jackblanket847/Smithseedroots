<!-- Centralized Analytics Policy Layer -->
<script>
  /* Rulemaking Policy: Traffic Observation */
  const AnalyticsPolicy = {
    allowTracking: true,
    anonymizeIP: true,
    dataRetentionDays: 30,
    routeRules: {
      "/": "home_view",
      "/gallery": "gallery_view"

  }
